
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarlosVPN · 管理员后台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 18px;
      background: #090d16;
      color: #e8edf7;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 1100px; margin: auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 30px;
    }
    h1 { font-size: 25px; margin: 0 0 8px; }
    .muted { color: #8995aa; font-size: 13px; }
    .panel {
      background: #111827;
      border: 1px solid #263247;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 10px;
    }
    button, select {
      border: 1px solid #34435b;
      background: #1b2940;
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
    }
    button:hover { background: #293c5c; }
    button:disabled { opacity: .5; cursor: wait; }
    .confirm {
      background: #176b50;
      border-color: #238a69;
    }
    .confirm:hover { background: #218363; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 750px; }
    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #263247;
      font-size: 13px;
    }
    th { color: #91a0b8; font-weight: 500; }
    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      background: #49391b;
      color: #f2c66d;
    }
    .status.paid {
      background: #164532;
      color: #76dfac;
    }
    .message { color: #9eabc0; margin: 12px 0; font-size: 14px; }
    .error { color: #ff8585; }
    .empty { text-align: center; padding: 35px; color: #8995aa; }
    @media (max-width: 650px) {
      body { padding: 20px 12px; }
      .stats { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>CarlosVPN 管理员后台</h1>
        <div class="muted">会员订单管理 · Admin Console</div>
      </div>
      <button onclick="loadOrders()">刷新订单</button>
    </header>

    <section class="panel">
      <div class="muted">管理员账户</div>
      <div id="adminEmail" style="margin-top:8px">正在验证身份……</div>
      <div id="message" class="message">正在连接服务器……</div>
    </section>

    <section class="stats">
      <div class="panel stat">
        <div class="muted">全部订单</div>
        <strong id="totalCount">—</strong>
      </div>
      <div class="panel stat">
        <div class="muted">待处理订单</div>
        <strong id="pendingCount">—</strong>
      </div>
      <div class="panel stat">
        <div class="muted">已确认订单</div>
        <strong id="paidCount">—</strong>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2 style="font-size:18px;margin:0 0 6px">订单管理</h2>
          <div class="muted">查看会员订单并进行模拟付款确认</div>
        </div>
        <select id="statusFilter" onchange="renderOrders()">
          <option value="all">全部订单</option>
          <option value="pending">待处理</option>
          <option value="paid">已确认</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>用户邮箱</th>
              <th>会员套餐</th>
              <th>金额</th>
              <th>订单状态</th>
              <th>创建时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="6" class="empty">正在加载订单……</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="muted">
      注意：当前是模拟订单确认，不代表真实支付成功。正式上线前必须接入支付网关并验证支付回调。
    </div>
  </main>

<script>
const API_BASE = "https://membership-api-demo.carlo202509.workers.dev";
let allOrders = [];

function getToken() {
  return sessionStorage.getItem("portal_token");
}

function setMessage(text, isError = false) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = isError ? "message error" : "message";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function apiRequest(path, options = {}) {
  const token = getToken();

  if (!token) {
    throw new Error("没有登录凭证，请返回会员首页重新登录。");
  }

  const response = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {}),
      Authorization: "Bearer " + token
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok || data.success === false) {
    throw new Error(data.error || data.message || `请求失败：${response.status}`);
  }

  return data;
}

async function verifyAdmin() {
  const data = await apiRequest("/api/admin/me");

  if (!data.is_admin) {
    throw new Error("当前账号不是管理员，无法访问后台。");
  }

  document.getElementById("adminEmail").textContent =
    data.user?.email || "管理员";
}

async function loadOrders() {
  try {
    setMessage("正在读取订单……");

    const data = await apiRequest("/api/admin/orders");
    allOrders = data.orders || [];

    document.getElementById("totalCount").textContent =
      data.total ?? allOrders.length;

    document.getElementById("pendingCount").textContent =
      allOrders.filter(order => order.status === "pending").length;

    document.getElementById("paidCount").textContent =
      allOrders.filter(order => order.status === "paid").length;

    renderOrders();
    setMessage("订单加载成功。");
  } catch (error) {
    setMessage(error.message, true);
  }
}

function renderOrders() {
  const filter = document.getElementById("statusFilter").value;

  const orders = allOrders.filter(order =>
    filter === "all" || order.status === filter
  );

  const tbody = document.getElementById("ordersBody");

  if (!orders.length) {
    tbody.innerHTML =
      '<tr><td colspan="6" class="empty">没有符合条件的订单</td></tr>';
    return;
  }

  tbody.innerHTML = orders.map(order => {
    const paid = order.status === "paid";
    const statusText = paid ? "已确认" : order.status;

    return `
      <tr>
        <td>${escapeHTML(order.email)}</td>
        <td>${escapeHTML(order.plan_name)}</td>
        <td>¥${(Number(order.amount_cents || 0) / 100).toFixed(2)}</td>
        <td>
          <span class="status ${paid ? "paid" : ""}">
            ${escapeHTML(statusText)}
          </span>
        </td>
        <td>${escapeHTML(order.created_at)}</td>
        <td>
          ${
            paid
              ? '<span class="muted">已处理</span>'
              : `<button class="confirm"
                   onclick="confirmOrder('${escapeHTML(order.id)}')">
                   确认模拟付款
                 </button>`
          }
        </td>
      </tr>
    `;
  }).join("");
}

async function confirmOrder(orderId) {
  const order = allOrders.find(item => item.id === orderId);
  if (!order) return;

  const accepted = confirm(
    `确定要确认这笔订单吗？\n\n用户：${order.email}\n套餐：${order.plan_name}\n\n这只是模拟付款确认，会开通会员。`
  );

  if (!accepted) return;

  try {
    setMessage("正在确认订单并开通会员……");

    const result = await apiRequest("/api/admin/orders/confirm", {
      method: "POST",
      body: JSON.stringify({ order_id: orderId })
    });

    setMessage(result.message || "订单确认请求成功。");
    await loadOrders();
  } catch (error) {
    setMessage(error.message, true);
  }
}

async function init() {
  try {
    await verifyAdmin();
    await loadOrders();
  } catch (error) {
    setMessage(error.message, true);
    document.getElementById("ordersBody").innerHTML =
      '<tr><td colspan="6" class="empty">管理员验证失败，请返回会员首页检查登录状态。</td></tr>';
  }
}

init();
</script>
</body>
</html>
